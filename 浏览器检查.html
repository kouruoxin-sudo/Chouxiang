<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>臭翔 · 手机数据诊断</title><style>*{box-sizing:border-box}body{background:#fdf8ee;color:#392b20;font:16px/1.65 system-ui,-apple-system,sans-serif;margin:0;padding:24px 18px}.wrap{max-width:580px;margin:auto}h1{font-size:25px;margin:12px 0}p{color:#735b4b}.card{border:1px solid #e5d7bb;border-radius:20px;background:#fff;padding:20px;margin:16px 0}button{border:0;background:#b96b3d;color:#fff;border-radius:999px;padding:13px 20px;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace}small{color:#876d60}</style></head><body><main class="wrap"><h1>臭翔 · 手机数据诊断</h1><p>只读取数据数量和占用量，不读取、展示或上传 API Key、密码、菜谱内容，也不删除任何东西。</p><div class="card"><button id="go">检查当前浏览器</button><pre id="out">尚未开始</pre><button id="copy" style="display:none">复制诊断结果</button></div><small>请务必用平时打不开小程序的 Chrome 普通标签页打开此页面（不要使用无痕）。它和小程序必须在同一个网站域名下才能读取同一份存储空间。</small></main><script>
(function(){const o=document.getElementById('out'), go=document.getElementById('go'), copy=document.getElementById('copy');let report='';const fmt=n=>Number.isFinite(n)?(n/1024/1024).toFixed(2)+' MB':'未知';const timeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('读取超时')),ms))]);function examineIDB(){return new Promise(resolve=>{let done=false;const finish=s=>{if(done)return;done=true;resolve(s)};try{const req=indexedDB.open('chouxiang-photos');req.onerror=()=>finish('照片数据库：读取失败');req.onblocked=()=>finish('照片数据库：被其它页面占用');req.onupgradeneeded=()=>{req.transaction.abort();finish('照片数据库：未找到（未创建）')};req.onsuccess=()=>{const db=req.result;try{if(!db.objectStoreNames.contains('photos')){db.close();return finish('照片数据库：没有 photos 表')}let n=0;const tx=db.transaction('photos','readonly');const cr=tx.objectStore('photos').openKeyCursor();cr.onsuccess=()=>{if(cr.result){n++;cr.result.continue()}else{db.close();finish('照片数据条目数（含元数据）：'+n)}};cr.onerror=()=>{db.close();finish('照片条目数量：读取失败')};tx.onerror=()=>{db.close();finish('照片条目数量：事务失败')}}catch(e){db.close();finish('照片数据库：'+e.name)}}}catch(e){finish('照片数据库不可用：'+e.name)}})}go.onclick=async()=>{go.disabled=true;o.textContent='正在读取数量…';let lines=['诊断时间：'+new Date().toLocaleString('zh-CN'),'环境：'+(/CriOS/.test(navigator.userAgent)?'iOS Chrome':/Safari/.test(navigator.userAgent)?'Safari 或其它 WebKit':'其它浏览器')];try{for(const k of ['chouxiang-data-v1','chouxiang-rollback-v1','chouxiang-cloud-cfg','chouxiang-auth']){let s=localStorage.getItem(k);lines.push(k+': '+(s===null?'无':fmt(s.length*2)+'（仅字符占用估计）'))}}catch(e){lines.push('本地存储：无法读取 '+e.name)}try{if(navigator.storage&&navigator.storage.estimate){const t=await navigator.storage.estimate();lines.push('站点总存储用量：'+fmt(t.usage));lines.push('站点估算可用配额：'+fmt(t.quota))}}catch(e){lines.push('站点用量无法获取：'+e.name)}try{lines.push(await timeout(examineIDB(),12000))}catch(e){lines.push('照片数量读取超时')}report=lines.join('\n');o.textContent=report;copy.style.display='inline-block';go.disabled=false};copy.onclick=()=>{navigator.clipboard.writeText(report).then(()=>{copy.textContent='已复制'}).catch(()=>{copy.textContent='复制失败，请截图'})};})();
</script></body></html>
